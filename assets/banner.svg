<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#0d1b3a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="glowOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrb2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { opacity: 0.3; }
      }
      @keyframes scanline {
        0% { transform: translateY(-360px); }
        100% { transform: translateY(360px); }
      }
      .anim-orb-1 {
        transform-origin: 240px 108px;
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }
      .anim-orb-2 {
        transform-origin: 1020px 252px;
        animation: pulseGlow 10s ease-in-out infinite alternate;
      }
      .anim-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-line-1 {
        stroke-dasharray: 120 60;
        animation: dashFlow 20s linear infinite;
      }
      .anim-line-2 {
        stroke-dasharray: 80 40;
        animation: dashFlow 14s linear infinite reverse;
      }
      .anim-shimmer {
        animation: shimmer 4s ease-in-out infinite;
      }
      .badge-glow {
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4));
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="240" cy="110" r="280" fill="url(#glowOrb1)" class="anim-orb-1" />
  <circle cx="1020" cy="250" r="320" fill="url(#glowOrb2)" class="anim-orb-2" />

  <!-- Subtle Perspective Grid / Matrix in Lower Half -->
  <g opacity="0.4">
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#0284c7" stroke-width="0.7" stroke-opacity="0.4" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#0284c7" stroke-width="1.0" stroke-opacity="0.5" />
    <line x1="0" y1="358" x2="1200" y2="358" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Grid Ray Lines converging to vanishing center -->
    <line x1="600" y1="200" x2="0" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="200" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="400" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="600" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="800" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="1000" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
    <line x1="600" y1="200" x2="1200" y2="360" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.3" />
  </g>

  <!-- Network Circuit Lines (Cost Optimization Flow) -->
  <g fill="none" opacity="0.6">
    <path d="M 60 70 L 220 70 L 300 130 L 480 130" stroke="#38bdf8" stroke-width="1.5" class="anim-line-1" />
    <circle cx="60" cy="70" r="3.5" fill="#38bdf8" />
    <circle cx="220" cy="70" r="3.5" fill="#38bdf8" />
    <circle cx="300" cy="130" r="3.5" fill="#818cf8" />

    <path d="M 1140 70 L 980 70 L 900 120 L 720 120" stroke="#818cf8" stroke-width="1.5" class="anim-line-2" />
    <circle cx="1140" cy="70" r="3.5" fill="#818cf8" />
    <circle cx="980" cy="70" r="3.5" fill="#818cf8" />
    <circle cx="900" cy="120" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Decorative Border Frame -->
  <rect x="12" y="12" width="1176" height="336" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  
  <!-- Outer Corner Tech Accents -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1188 40 L 1188 12 L 1160 12" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 12 320 L 12 348 L 40 348" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1188 320 L 1188 348 L 1160 348" fill="none" stroke="#00f2fe" stroke-width="3" />

  <!-- Center Icon: Cloud with Optimization Spark -->
  <g transform="translate(600, 75)" class="anim-float">
    <!-- Cloud Silhouette Background Glow -->
    <path d="M -45 10 A 25 25 0 0 1 -15 -18 A 38 38 0 0 1 35 -15 A 28 28 0 0 1 45 10 A 20 20 0 0 1 30 28 L -35 28 A 20 20 0 0 1 -45 10 Z" 
          fill="#0284c7" opacity="0.4" filter="url(#glowEffect)" />
    <!-- Crisp Cloud Path -->
    <path d="M -45 10 A 25 25 0 0 1 -15 -18 A 38 38 0 0 1 35 -15 A 28 28 0 0 1 45 10 A 20 20 0 0 1 30 28 L -35 28 A 20 20 0 0 1 -45 10 Z" 
          fill="#0f172a" stroke="url(#accentCyan)" stroke-width="2.5" />
    <!-- Efficiency Dynamic Gauge / Arrow within Cloud -->
    <path d="M -12 12 L 6 -6 L 16 -2 L 18 -18 L 2 -16 L 8 -11 L -4 7 Z" fill="#38bdf8" class="anim-shimmer" />
  </g>

  <!-- Header Typography Group -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(600, 142)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      ⚡ FINOPS &amp; KUBERNETES EFFICIENCY
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 205)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 10px rgba(0, 242, 254, 0.35))">
      Awesome Cloud Resource Optimization
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 248)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="17" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.3">
      Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; Autonomous Workload Rightsizers
    </text>
  </g>

  <!-- Feature Pills / Highlights Bottom Row -->
  <g transform="translate(600, 298)">
    <!-- Pill 1: Workload Rightsizing -->
    <g transform="translate(-390, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-85" cy="0" r="4" fill="#38bdf8" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">
        Workload Rightsizing
      </text>
    </g>

    <!-- Pill 2: Spot Orchestration -->
    <g transform="translate(-130, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-85" cy="0" r="4" fill="#818cf8" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">
        Spot Orchestration
      </text>
    </g>

    <!-- Pill 3: Autonomous Bin Packing -->
    <g transform="translate(130, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-85" cy="0" r="4" fill="#34d399" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">
        Smart Bin-Packing
      </text>
    </g>

    <!-- Pill 4: Cloud FinOps -->
    <g transform="translate(390, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="-85" cy="0" r="4" fill="#fbbf24" />
      <text x="-70" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">
        FinOps &amp; Governance
      </text>
    </g>
  </g>
</svg>
